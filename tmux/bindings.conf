# vim: ft=tmux

# Key bindings

# Reload configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Reloaded!"

# Vim-Tmux-Navigator handles for pane navigation
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Move windows
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Kill other panes
bind -r e kill-pane -a

# Redize Panes 
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Fast-type correciton (Ctrl + Key)

# Native tmux actions
bind C-c new-window
bind C-n next-window
bind C-p previous-window
bind C-w choose-window
bind C-d detach-client

# Custom actions
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Tmux Reloaded!"

# Dev layout: big pane (nvim) left, smaller (claude) top-right, smallest (shell) bottom-right
# Kills any other panes first so re-pressing D always resets to a clean layout
bind D kill-pane -a \; \
       split-window -h -p 35 -c "#{pane_current_path}" \; \
       split-window -v -p 35 -c "#{pane_current_path}" \; \
       select-pane -t 0 \; send-keys "nvim" Enter \; \
       select-pane -t 1 \; send-keys "claude" Enter \; \
       select-pane -t 0
