# vim: ft=tmux

# Key bindings

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Reloaded!"

# Vim-Tmux-Navigator handles for pane navigation
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Move windows
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Kill other panes
bind -r e kill-pane -a

# Swap with the neighbour on that side; the cursor stays put, now on the
# neighbour's content (-s, not -t: with -t it follows ours). Wraps at the edge.
bind H swap-pane -d -s '{left-of}'
bind J swap-pane -d -s '{down-of}'
bind K swap-pane -d -s '{up-of}'
bind L swap-pane -d -s '{right-of}'

# Resize mode: no repeat-time race. h/j/k/l move 5 cells, H/J/K/L move 1, and
# each bind re-enters the table. Esc/Enter/q leave; any other key also leaves,
# and runs only if it is a root bind (e.g. C-h), otherwise it is swallowed.
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize H resize-pane -L 1 \; switch-client -T resize
bind -T resize J resize-pane -D 1 \; switch-client -T resize
bind -T resize K resize-pane -U 1 \; switch-client -T resize
bind -T resize L resize-pane -R 1 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize q switch-client -T root

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Native tmux actions
bind C-c new-window
bind C-n next-window
bind C-p previous-window
bind C-w choose-window
bind C-d detach-client

# Dev layout: big pane (nvim) left, smaller (claude) top-right, smallest (shell) bottom-right
# Kills any other panes first so re-pressing D always resets to a clean layout
bind D kill-pane -a \; \
       split-window -h -p 35 -c "#{pane_current_path}" \; \
       split-window -v -p 35 -c "#{pane_current_path}" \; \
       select-pane -t 0 \; send-keys "nvim" Enter \; \
       select-pane -t 1 \; send-keys "claude" Enter \; \
       select-pane -t 0
