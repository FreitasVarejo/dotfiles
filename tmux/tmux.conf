# vim: ft=tmux

# General config

set -g prefix C-s
set-option -g repeat-time 100
set-option -g focus-events on

# Fix escape time for Neovim
set -sg escape-time 0

# UTF-8 Locale Support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on

set -g mouse on

# Apps like Claude Code draw on the terminal's alternate screen, which tmux
# doesn't add to its scrollback history — disabling it keeps everything on
# the normal screen so copy-mode/visual scrolling works inside those apps
set-option -g alternate-screen off

# Window naming configuration - KEEP IT SIMPLE
set -g automatic-rename on
#set -g automatic-rename-format "#{pane_current_command}"

# Copy Mode settings (Bindings are in bindings.conf)
set -s set-clipboard on
setw -g mode-keys vi

# Scrollback: o default (2000) nao aguenta uma sessao longa de claude/agente.
# Vale so para panes criados depois de recarregar o config.
set -g history-limit 100000

# Imports

source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/colors.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/statusline.conf

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (Keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
