# vim: ft=tmux

# General config

set -g prefix C-s
set-option -g repeat-time 100
set-option -g focus-events on

# Fix escape time for Neovim
set -sg escape-time 0

# UTF-8 Locale Support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on

set -g mouse on

# Apps like Claude Code draw on the terminal's alternate screen, which tmux
# doesn't add to its scrollback history — disabling it keeps everything on
# the normal screen so copy-mode/visual scrolling works inside those apps
set-option -g alternate-screen off

set -g automatic-rename on

# Copy Mode settings (Bindings are in bindings.conf)
set -s set-clipboard on
setw -g mode-keys vi

# Scrollback: o default (2000) nao aguenta uma sessao longa de claude/agente.
# Vale so para panes criados depois de recarregar o config.
set -g history-limit 100000

# Imports

source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/statusline.conf

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Snapshot e restauração (tmux-resurrect). O gatilho é o timer de usuário
# tmux-snapshot (sem tmux-continuum: ele grava pelo status-right, que só roda
# com cliente atrelado). Prefix + C-s grava, prefix + C-r restaura.
# scripts/snapshot e scripts/revive: contrato @revive.
set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-processes 'freitask-tui yazi'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/snapshot layout-hook'
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/snapshot revive-hook'

# Fechar uma sessão grava o snapshot na hora. A última sessão fecha junto com o
# servidor e o hook não roda: o snapshot fica o de antes, e o próximo `t`
# restaura. Só o `t kall` marca o fechamento como deliberado.
set-hook -g session-closed "run-shell -b '~/.config/tmux/scripts/snapshot closed'"

# Initialize TPM (Keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
